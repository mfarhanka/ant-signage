<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Signboard Design Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Signboard Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Cinzel:wght@700&family=Inter:wght@300;400;600;800&family=Montserrat:ital,wght@0,300;0,700;0,900;1,400&family=Orbitron:wght@500;900&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom utility animations */
    @keyframes neon-pulse {
      0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 12px var(--glow-color)) drop-shadow(0 0 25px var(--glow-color)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px var(--glow-color)) drop-shadow(0 0 45px var(--glow-color)) drop-shadow(0 0 60px var(--glow-color)); }
    }
    @keyframes neon-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.3; }
    }
    .neon-pulse-active {
      animation: neon-pulse 2s infinite ease-in-out;
    }
    .neon-flicker-active {
      animation: neon-flicker 4s infinite linear;
    }
    /* Scrollbars themed to dark charcoal grey */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
  </style>
</head>
<body class="h-full overflow-hidden font-sans bg-black">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- React & Babel Direct Script -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const FONTS = [
      { id: 'Bebas Neue', name: 'Bebas Neue (Bold Sans)', type: 'sans' },
      { id: 'Pacifico', name: 'Pacifico (Neon Cursive)', type: 'cursive' },
      { id: 'Montserrat', name: 'Montserrat (Modern Clean)', type: 'sans' },
      { id: 'Orbitron', name: 'Orbitron (Futuristic)', type: 'tech' },
      { id: 'Playfair Display', name: 'Playfair Display (Elegant)', type: 'serif' },
      { id: 'Caveat', name: 'Caveat (Casual Script)', type: 'handwriting' },
      { id: 'Special Elite', name: 'Special Elite (Retro Grunge)', type: 'grunge' },
      { id: 'Cinzel', name: 'Cinzel (Classical Roman)', type: 'serif' }
    ];

    const TEXTURES = [
      {
        id: 'matte-black',
        name: 'Matte Charcoal Metal',
        class: 'bg-gradient-to-br from-neutral-800 via-neutral-900 to-neutral-950 border-neutral-700',
        style: { backgroundBlendMode: 'multiply' },
        costFactor: 45
      },
      {
        id: 'brushed-aluminum',
        name: 'Brushed Titanium',
        class: 'bg-gradient-to-r from-zinc-300 via-zinc-400 to-zinc-200 border-zinc-300',
        style: {
          backgroundImage: 'repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 10px), linear-gradient(135deg, #e4e4e7 0%, #d4d4d8 50%, #a1a1aa 100%)',
          boxShadow: 'inset 0 0 30px rgba(0,0,0,0.1)'
        },
        costFactor: 70
      },
      {
        id: 'warm-oak',
        name: 'Rustic Warm Oak',
        class: 'border-amber-900',
        style: {
          backgroundImage: 'repeating-linear-gradient(0deg, #78350f 0px, #78350f 4px, #92400e 4px, #92400e 40px, #b45309 40px, #b45309 44px)',
          boxShadow: 'inset 0 0 40px rgba(0,0,0,0.4)',
        },
        costFactor: 60
      },
      {
        id: 'concrete-slate',
        name: 'Industrial Cement',
        class: 'border-zinc-500',
        style: {
          backgroundColor: '#52525b',
          backgroundImage: 'radial-gradient(#3f3f46 15%, transparent 16%), radial-gradient(#27272a 15%, transparent 16%)',
          backgroundSize: '16px 16px',
          backgroundPosition: '0 0, 8px 8px',
          filter: 'contrast(1.1) brightness(0.85)',
          boxShadow: 'inset 0 0 30px rgba(0,0,0,0.5)'
        },
        costFactor: 50
      },
      {
        id: 'white-marble',
        name: 'Carrara White Marble',
        class: 'border-zinc-200 text-zinc-800',
        style: {
          backgroundColor: '#f4f4f5',
          backgroundImage: 'linear-gradient(140deg, transparent 40%, rgba(161,161,170,0.15) 41%, rgba(161,161,170,0.15) 44%, transparent 45%), linear-gradient(35deg, transparent 60%, rgba(161,161,170,0.15) 61%, rgba(161,161,170,0.15) 63%, transparent 64%)',
          boxShadow: 'inset 0 0 20px rgba(255,255,255,0.8)'
        },
        costFactor: 95
      },
      {
        id: 'brick-pattern',
        name: 'Vintage Red Brick',
        class: 'border-red-950',
        style: {
          backgroundColor: '#991b1b',
          backgroundImage: 'linear-gradient(30deg, #7f1d1d 25%, transparent 25%), linear-gradient(150deg, #7f1d1d 25%, transparent 25%), linear-gradient(270deg, #7f1d1d 25%, transparent 25%), linear-gradient(330deg, #7f1d1d 25%, transparent 25%), linear-gradient(90deg, #7f1d1d 25%, transparent 25%), linear-gradient(210deg, #7f1d1d 25%, transparent 25%)',
          backgroundSize: '24px 24px',
          boxShadow: 'inset 0 0 50px rgba(0,0,0,0.6)'
        },
        costFactor: 55
      }
    ];

    const SCENES = [
      {
        id: 'alley',
        name: 'Midnight Urban Alley',
        class: 'bg-neutral-950',
        style: {
          backgroundImage: 'radial-gradient(circle at 10% 20%, rgba(24,24,27,0.85) 0%, rgba(9,9,11,0.99) 90%), url("https://images.unsplash.com/photo-1517089531140-2a1ab9db21de?q=80&w=1200&auto=format&fit=crop")',
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          mixBlendMode: 'normal'
        },
        ambientMultiplier: 0.1
      },
      {
        id: 'cafe',
        name: 'Modern Brick Cafe Wall',
        class: 'bg-zinc-900',
        style: {
          backgroundImage: 'linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url("https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1200&auto=format&fit=crop")',
          backgroundSize: 'cover',
          backgroundPosition: 'center'
        },
        ambientMultiplier: 0.35
      },
      {
        id: 'office',
        name: 'Sleek Corporate Lobby',
        class: 'bg-zinc-900',
        style: {
          backgroundImage: 'linear-gradient(rgba(9,9,11,0.5), rgba(9,9,11,0.9)), url("https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1200&auto=format&fit=crop")',
          backgroundSize: 'cover',
          backgroundPosition: 'center'
        },
        ambientMultiplier: 0.6
      },
      {
        id: 'studio',
        name: 'Minimal Dark Studio Room',
        class: 'bg-zinc-950',
        style: {
          backgroundImage: 'radial-gradient(circle at 50% 50%, #27272a 0%, #09090b 100%)'
        },
        ambientMultiplier: 0.2
      }
    ];

    const SHAPES = [
      { id: 'rectangle', name: 'Classic Rectangle', icon: 'square', radius: 'rounded-none' },
      { id: 'rounded-rect', name: 'Rounded Rectangle', icon: 'box', radius: 'rounded-3xl' },
      { id: 'oval', name: 'Sleek Oval', icon: 'circle-dot', radius: 'rounded-[100px]' },
      { id: 'circle', name: 'Perfect Circle', icon: 'circle', radius: 'rounded-full' },
      { id: 'hexagon', name: 'Hexagonal Geometric', icon: 'hexagon', radius: 'polygon-hexagon' }
    ];

    const PRESET_COLORS = [
      { name: 'Pure Crimson Red', hex: '#ff0000', shadow: 'rgba(255,0,0,0.7)' },
      { name: 'Anarchy Neon Red', hex: '#ff3b30', shadow: 'rgba(255,59,48,0.7)' },
      { name: 'Tokyo Pink-Red', hex: '#ff0055', shadow: 'rgba(255,0,85,0.7)' },
      { name: 'Cyber Orange-Red', hex: '#ff5e00', shadow: 'rgba(255,94,0,0.7)' },
      { name: 'Industrial Amber', hex: '#ffaa00', shadow: 'rgba(255,170,0,0.7)' },
      { name: 'Pure Charcoal Gray', hex: '#8a8a8a', shadow: 'rgba(138,138,138,0.5)' },
      { name: 'Incandescent Warm', hex: '#ffe6cc', shadow: 'rgba(255,230,204,0.6)' },
      { name: 'Monochrome LED White', hex: '#ffffff', shadow: 'rgba(255,255,255,0.5)' }
    ];

    function App() {
      // Sidebar State
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [sidebarTab, setSidebarTab] = useState('text'); // 'text', 'lighting', 'plate', 'scene', 'quote'

      // Signboard Content State (Layers System)
      const [layers, setLayers] = useState([
        {
          id: '1',
          text: 'A&T Media Sdn. Bhd.',
          fontFamily: 'Bebas Neue',
          fontSize: 52,
          letterSpacing: 6,
          color: '#ffffff',
          x: 50, // relative position in percent
          y: 35,
          angle: 0,
          bold: false,
          italic: false
        },
        {
          id: '2',
          text: 'Open 24 Hours',
          fontFamily: 'Pacifico',
          fontSize: 28,
          letterSpacing: 1,
          color: '#ff0000', // Default red color
          x: 50,
          y: 65,
          angle: -3,
          bold: false,
          italic: false
        }
      ]);
      const [selectedLayerId, setSelectedLayerId] = useState('1');

      // Illumination States
      const [lightType, setLightType] = useState('neon'); // 'neon', 'backlit', 'frontlit', 'edgelit', 'none'
      const [glowColor, setGlowColor] = useState('#ff0000'); // Default glow color changed to pure red
      const [glowIntensity, setGlowIntensity] = useState(85);
      const [pulseActive, setPulseActive] = useState(false);
      const [flickerActive, setFlickerActive] = useState(false);
      const [powerOn, setPowerOn] = useState(true);

      // Backing Board Settings
      const [boardTexture, setBoardTexture] = useState('matte-black');
      const [boardShape, setBoardShape] = useState('rounded-rect');
      const [boardWidth, setBoardWidth] = useState(80); // percent of max workspace width
      const [boardHeight, setBoardHeight] = useState(60); // percent of max workspace height
      const [borderWidth, setBorderWidth] = useState(4); // px
      const [borderColor, setBorderColor] = useState('#27272a'); // default charcoal border color
      const [hasSpacers, setHasSpacers] = useState(true);
      const [showMeasurements, setShowMeasurements] = useState(false);

      // Environment Controls
      const [envScene, setEnvScene] = useState('alley');
      const [daytimeIntensity, setDaytimeIntensity] = useState(15); // slider 0-100 (0 is dark midnight)
      const [isometricTiltX, setIsometricTiltX] = useState(10); // degrees tilt
      const [isometricTiltY, setIsometricTiltY] = useState(-15); // degrees tilt
      const [is3DActive, setIs3DActive] = useState(true);

      // Dragging layer logic state
      const [isDragging, setIsDragging] = useState(false);
      const [dragStartPos, setDragStartPos] = useState({ x: 0, y: 0 });
      const [layerStartPos, setLayerStartPos] = useState({ x: 0, y: 0 });
      const boardRef = useRef(null);

      // Quote & Checkout Modal trigger
      const [isQuoteModalOpen, setIsQuoteModalOpen] = useState(false);

      // Select active layer object helper
      const activeLayer = useMemo(() => {
        return layers.find(l => l.id === selectedLayerId) || layers[0];
      }, [layers, selectedLayerId]);

      // Calculate automatic prices
      const calculatedPricing = useMemo(() => {
        const shapeCost = boardShape === 'hexagon' ? 120 : 80;
        const textureObj = TEXTURES.find(t => t.id === boardTexture);
        const backingCost = ((boardWidth * boardHeight) / 5) * (textureObj ? textureObj.costFactor / 10 : 5);
        
        let tubeLengthEstimate = 0;
        layers.forEach(layer => {
          // rough length estimate based on text size and letter length
          tubeLengthEstimate += (layer.text.replace(/\s/g, '').length) * (layer.fontSize * 0.12);
        });

        const lightingMultiplier = {
          neon: 2.2,
          backlit: 2.5,
          frontlit: 1.8,
          edgelit: 1.5,
          none: 0
        }[lightType];

        const lightCost = tubeLengthEstimate * 15 * lightingMultiplier;
        const hardwareCost = hasSpacers ? 40 : 15;
        const total = shapeCost + backingCost + lightCost + hardwareCost;

        return {
          backing: Math.round(backingCost),
          structural: Math.round(shapeCost),
          tubes: Math.round(lightCost),
          hardware: Math.round(hardwareCost),
          total: Math.round(total)
        };
      }, [boardShape, boardTexture, boardWidth, boardHeight, layers, lightType, hasSpacers]);

      // Update Layer property safely
      const updateActiveLayer = (key, val) => {
        if (!selectedLayerId) return;
        setLayers(prev => prev.map(l => l.id === selectedLayerId ? { ...l, [key]: val } : l));
      };

      // Add a fresh layer
      const addNewLayer = () => {
        const id = (Date.now()).toString();
        const newL = {
          id,
          text: 'NEW SIGN TEXT',
          fontFamily: 'Montserrat',
          fontSize: 32,
          letterSpacing: 3,
          color: '#ff0000', // Default new layer color to themed red
          x: 50,
          y: 50,
          angle: 0,
          bold: false,
          italic: false
        };
        setLayers([...layers, newL]);
        setSelectedLayerId(id);
      };

      // Remove current layer
      const removeActiveLayer = () => {
        if (layers.length <= 1) return; // always keep at least one
        const remaining = layers.filter(l => l.id !== selectedLayerId);
        setLayers(remaining);
        setSelectedLayerId(remaining[0].id);
      };

      // Duplicate layer
      const duplicateActiveLayer = () => {
        if (!activeLayer) return;
        const id = (Date.now()).toString();
        const dupe = {
          ...activeLayer,
          id,
          text: `${activeLayer.text} (Copy)`,
          y: Math.min(activeLayer.y + 10, 90)
        };
        setLayers([...layers, dupe]);
        setSelectedLayerId(id);
      };

      // Handle dragging on workspace backing board
      const handleMouseDown = (e, layerId) => {
        e.stopPropagation();
        setSelectedLayerId(layerId);
        const l = layers.find(x => x.id === layerId);
        if (!l || !boardRef.current) return;

        const rect = boardRef.current.getBoundingClientRect();
        setIsDragging(true);
        setDragStartPos({
          x: e.clientX,
          y: e.clientY
        });
        setLayerStartPos({
          x: l.x,
          y: l.y
        });
      };

      const handleMouseMove = (e) => {
        if (!isDragging || !boardRef.current || !activeLayer) return;
        const rect = boardRef.current.getBoundingClientRect();
        
        // Compute delta movement in percent of the actual signboard backing board
        const deltaX = ((e.clientX - dragStartPos.x) / rect.width) * 100;
        const deltaY = ((e.clientY - dragStartPos.y) / rect.height) * 100;

        // Constraint within bounding coordinates
        const newX = Math.max(0, Math.min(100, layerStartPos.x + deltaX));
        const newY = Math.max(0, Math.min(100, layerStartPos.y + deltaY));

        updateActiveLayer('x', parseFloat(newX.toFixed(1)));
        updateActiveLayer('y', parseFloat(newY.toFixed(1)));
      };

      const handleMouseUp = () => {
        setIsDragging(false);
      };

      // Touch screen dragging logic
      const handleTouchStart = (e, layerId) => {
        e.stopPropagation();
        setSelectedLayerId(layerId);
        const l = layers.find(x => x.id === layerId);
        if (!l || !boardRef.current) return;

        const touch = e.touches[0];
        setIsDragging(true);
        setDragStartPos({
          x: touch.clientX,
          y: touch.clientY
        });
        setLayerStartPos({
          x: l.x,
          y: l.y
        });
      };

      const handleTouchMove = (e) => {
        if (!isDragging || !boardRef.current || !activeLayer) return;
        const rect = boardRef.current.getBoundingClientRect();
        const touch = e.touches[0];
        
        const deltaX = ((touch.clientX - dragStartPos.x) / rect.width) * 100;
        const deltaY = ((touch.clientY - dragStartPos.y) / rect.height) * 100;

        const newX = Math.max(0, Math.min(100, layerStartPos.x + deltaX));
        const newY = Math.max(0, Math.min(100, layerStartPos.y + deltaY));

        updateActiveLayer('x', parseFloat(newX.toFixed(1)));
        updateActiveLayer('y', parseFloat(newY.toFixed(1)));
      };

      // Render custom inline styling for layers depending on selected lighting type
      const getLayerStyle = (layer) => {
        const isSelected = layer.id === selectedLayerId;
        const color = layer.color;
        
        // Switch glow animations and styling based on active parameters
        const glowingPower = powerOn && glowIntensity > 0;
        const glowOpacity = glowIntensity / 100;
        
        // Define glow color based on either the uniform illumination glowColor or specific text layer colors
        const activeColor = lightType === 'neon' ? color : glowColor;

        let style = {
          fontFamily: `'${layer.fontFamily}', sans-serif`,
          fontSize: `${layer.fontSize * 0.8}px`,
          letterSpacing: `${layer.letterSpacing}px`,
          color: '#ffffff',
          transform: `translate(-50%, -50%) rotate(${layer.angle}deg)`,
          left: `${layer.x}%`,
          top: `${layer.y}%`,
          transition: isDragging ? 'none' : 'text-shadow 0.2s, box-shadow 0.2s'
        };

        if (lightType === 'neon') {
          if (glowingPower) {
            style.color = '#ffffff';
            // Pure physical gas glass look: white/light center tube with heavy colored atmospheric back dispersion
            style.textShadow = `
              0 0 4px #ffffff,
              0 0 10px ${color},
              0 0 20px ${color},
              0 0 45px ${color},
              0 0 70px ${color}
            `;
          } else {
            style.color = 'rgba(255,255,255,0.2)';
            style.textShadow = '0 1px 3px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1)';
          }
        } else if (lightType === 'backlit') {
          // Solid steel front projection, throwing halo behind the letters onto backing board
          style.color = color;
          style.textShadow = '0 2px 4px rgba(0,0,0,0.9)';
        } else if (lightType === 'frontlit') {
          // Bulbs or fully illuminating high-glow fronts
          if (glowingPower) {
            style.color = color;
            style.textShadow = `
              0 0 12px #ffffff,
              0 0 30px ${color},
              0 0 50px ${color}
            `;
          } else {
            style.color = 'rgba(161,161,170,0.9)';
            style.textShadow = 'none';
          }
        } else if (lightType === 'edgelit') {
          // Acrylic plate engraving catches illumination
          if (glowingPower) {
            style.color = 'transparent';
            style.webkitTextStroke = `1.5px ${color}`;
            style.textShadow = `0 0 8px ${color}`;
          } else {
            style.color = 'transparent';
            style.webkitTextStroke = '1px rgba(255,255,255,0.25)';
          }
        } else {
          // Classic physical flat sign
          style.color = color;
          style.textShadow = '1px 1px 0px rgba(0,0,0,0.4), 2px 2px 5px rgba(0,0,0,0.5)';
        }

        return style;
      };

      // Custom background styles depending on selected texture and scene
      const textureObj = TEXTURES.find(t => t.id === boardTexture) || TEXTURES[0];
      const sceneObj = SCENES.find(s => s.id === envScene) || SCENES[0];

      // Reset all settings helper themed specifically to Red & Black layout
      const handleReset = () => {
        setLayers([
          {
            id: '1',
            text: 'A&T Media Sdn. Bhd.',
            fontFamily: 'Bebas Neue',
            fontSize: 52,
            letterSpacing: 6,
            color: '#ffffff',
            x: 50,
            y: 35,
            angle: 0
          }
        ]);
        setSelectedLayerId('1');
        setLightType('neon');
        setGlowColor('#ff0000'); // Reset to red
        setBoardTexture('matte-black');
        setBoardShape('rounded-rect');
        setDaytimeIntensity(20);
        setIsometricTiltX(10);
        setIsometricTiltY(-15);
      };

      // Trigger automatic icon loading
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [sidebarTab, sidebarOpen, boardTexture, boardShape, envScene, lightType]);

      return (
        <div className="h-full flex flex-col md:flex-row bg-black overflow-hidden" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onTouchMove={handleTouchMove} onTouchEnd={handleMouseUp}>
          
          {/* EXPANDABLE LEFT SIDEBAR WITH RED, BLACK, AND GREY BRANDING */}
          <div className={`h-full bg-zinc-950 border-r border-zinc-800 flex flex-row transition-all duration-300 z-10 flex-shrink-0 relative ${sidebarOpen ? 'w-[390px]' : 'w-[72px]'}`}>
            
            {/* Collapse/Expand mini utility vertical tab strip */}
            <div className="w-[72px] bg-black flex flex-col items-center py-6 justify-between border-r border-zinc-900 h-full">
              <div className="flex flex-col space-y-6 items-center w-full">
                {/* Logo Branding - High Contrast Red Fire Glow */}
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-red-500 to-zinc-800 flex items-center justify-center text-white font-extrabold shadow-lg shadow-red-600/30 mb-4 hover:scale-105 transition-all">
                  <i data-lucide="zap" className="w-5 h-5 text-white"></i>
                </div>

                {/* Sidebar Tab Triggers */}
                {[
                  { id: 'text', icon: 'type', label: 'Typography' },
                  { id: 'lighting', icon: 'lightbulb', label: 'Illumination' },
                  { id: 'plate', icon: 'layout', label: 'Backing Plate' },
                  { id: 'scene', icon: 'image', label: 'Environment' },
                  { id: 'quote', icon: 'shopping-cart', label: 'Calculator' }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      setSidebarTab(tab.id);
                      setSidebarOpen(true);
                    }}
                    className={`p-3 rounded-xl transition-all relative group flex flex-col items-center justify-center ${sidebarTab === tab.id && sidebarOpen ? 'bg-zinc-900 text-red-500 border border-zinc-800' : 'text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900'}`}
                  >
                    <i data-lucide={tab.icon} className="w-5 h-5"></i>
                    <span className="absolute left-16 bg-zinc-900 text-zinc-100 text-xs px-2.5 py-1.5 rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-all shadow-xl border border-zinc-800 whitespace-nowrap z-50">
                      {tab.label}
                    </span>
                  </button>
                ))}
              </div>

              {/* Toggle Sidebar Collapse state */}
              <button
                onClick={() => setSidebarOpen(!sidebarOpen)}
                className="p-3 rounded-xl text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900 transition-all mt-auto"
                title={sidebarOpen ? 'Collapse menu' : 'Expand menu'}
              >
                <i data-lucide={sidebarOpen ? 'chevrons-left' : 'chevrons-right'} className="w-5 h-5"></i>
              </button>
            </div>

                              <span className="text-zinc-300">{isometricTiltX}°</span>
                            </div>
                            <input
                              type="range"
                              min="-30"
                              max="30"
                              value={isometricTiltX}
                              onChange={(e) => setIsometricTiltX(parseInt(e.target.value))}
                              className="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-red-500"
                            />
                          </div>

                          <div>
                            <div className="flex justify-between text-xs mb-1">
                              <span className="text-zinc-400">Orbit Yaw (Tilt Y)</span>
                              <span className="text-zinc-300">{isometricTiltY}°</span>
                            </div>
                            <input
                              type="range"
                              min="-45"
                              max="45"
                              value={isometricTiltY}
                              onChange={(e) => setIsometricTiltY(parseInt(e.target.value))}
                              className="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-red-500"
                            />
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* TAB 5: QUOTE CALCULATOR */}
                {sidebarTab === 'quote' && (
                  <div className="space-y-5">
                    <div className="bg-zinc-900/40 p-5 rounded-2xl border border-zinc-800 space-y-4">
                      <h3 className="text-sm font-bold uppercase tracking-widest text-red-500">Estimate Price Details</h3>
                      
                      <div className="space-y-2.5 text-xs">
                        <div className="flex justify-between text-zinc-400">
                          <span>Backing Board ({boardWidth * 2}x{boardHeight * 2} cm)</span>
                          <span className="text-zinc-200 font-mono">${calculatedPricing.backing}</span>
                        </div>
                        <div className="flex justify-between text-zinc-400">
                          <span>Signboard Silhouette Cut ({boardShape})</span>
                          <span className="text-zinc-200 font-mono">${calculatedPricing.structural}</span>
                        </div>
                        <div className="flex justify-between text-zinc-400">
                          <span>Illuminated Light Tubes ({lightType})</span>
                          <span className="text-zinc-200 font-mono">${calculatedPricing.tubes}</span>
                        </div>
                        <div className="flex justify-between text-zinc-400">
                          <span>Mounting Standoff Accessories</span>
                          <span className="text-zinc-200 font-mono">${calculatedPricing.hardware}</span>
                        </div>
                        <div className="border-t border-zinc-800 pt-3 flex justify-between text-sm font-bold text-zinc-200">
                          <span>Estimated Price Total</span>
                          <span className="text-red-500 font-mono">${calculatedPricing.total}</span>
                        </div>
                      </div>
                    </div>

                    <div className="bg-red-950/20 border border-red-900/30 p-4 rounded-xl">
                      <div className="flex space-x-3">
                        <i data-lucide="info" className="w-5 h-5 text-red-500 flex-shrink-0"></i>
                        <p className="text-xs text-red-400 leading-relaxed">
                          This estimation includes materials, high-voltage transformers/power brick, framing, custom letters neon tube bending, and premium acrylic CNC fabrication.
                        </p>
                      </div>
                    </div>

                    <button
                      onClick={() => setIsQuoteModalOpen(true)}
                      className="w-full bg-gradient-to-r from-red-600 via-red-700 to-zinc-800 text-white font-semibold py-3 px-4 rounded-xl hover:shadow-lg hover:shadow-red-600/20 transition-all flex items-center justify-center space-x-2 text-sm"
                    >
                      <i data-lucide="sparkles" className="w-4 h-4"></i>
                      <span>Request Fabrication Quote</span>
                    </button>
                  </div>
                )}

              </div>
            </div>
          </div>

          {/* MAIN VISUAL WORKSPACE AREA */}
          <div className="flex-1 h-full flex flex-col relative overflow-hidden bg-black">
            
            {/* Quick Context Control bar at top */}
            <div className="h-16 border-b border-zinc-900 px-6 flex items-center justify-between bg-zinc-950/50 backdrop-blur-md z-10">
              <div className="flex items-center space-x-3">
                <span className="text-xs font-semibold px-2.5 py-1 rounded bg-zinc-900 text-zinc-300 border border-zinc-800 flex items-center space-x-1">
                  <span className="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                  <span>Active Model Visualization</span>
                </span>
              </div>

              {/* Quick Preset Actions */}
              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setShowMeasurements(!showMeasurements)}
                  className={`p-2 rounded-xl border text-xs transition-all flex items-center space-x-1.5 ${showMeasurements ? 'bg-red-950/20 border-red-500 text-red-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-100'}`}
                  title="Toggle bounds grid guidelines"
                >
                  <i data-lucide="ruler" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Dimensions Layer</span>
                </button>

                <button
                  onClick={handleReset}
                  className="p-2 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-850 text-zinc-400 hover:text-zinc-100 text-xs transition-all flex items-center space-x-1.5"
                  title="Reset signboard back to defaults"
                >
                  <i data-lucide="refresh-cw" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Reset Workspace</span>
                </button>
              </div>
            </div>

            {/* INTERACTIVE WORKSPACE CANVAS VIEWPORT */}
            <div className="flex-1 relative flex items-center justify-center p-8 overflow-hidden select-none" style={sceneObj.style}>
              
              {/* Daytime overlay blending simulator */}
              <div
                className="absolute inset-0 pointer-events-none transition-all duration-300 z-[1]"
                style={{
                  backgroundColor: '#000000',
                  opacity: 1 - (daytimeIntensity / 100)
                }}
              />

              {/* Decorative Back Light Spot Projection (Visual realism glow element) */}
              {powerOn && lightType !== 'none' && (
                <div
                  className="absolute rounded-full pointer-events-none blur-[140px] transition-all duration-500 z-[2]"
                  style={{
                    width: `${boardWidth * 12}px`,
                    height: `${boardHeight * 10}px`,
                    backgroundColor: lightType === 'neon' ? activeLayer?.color : glowColor,
                    opacity: (glowIntensity / 100) * (0.32 - (daytimeIntensity / 100) * 0.2)
                  }}
                />
              )}

              {/* Outer Scale Dimension Guides */}
              {showMeasurements && (
                <div className="absolute inset-16 border-2 border-dashed border-zinc-700/50 pointer-events-none flex flex-col justify-between z-[10] p-4 text-zinc-500 text-[10px] font-mono">
                  <div className="flex justify-between">
                    <span>GRID LIMIT: {boardWidth * 2} cm MAX</span>
                    <span>COORDINATE AXIS SCALE</span>
                  </div>
                  <div className="flex justify-between">
                    <span>DEPTH MULTIPLIER: {is3DActive ? 'ACTIVE' : 'STATIC'}</span>
                    <span>HEIGHT: {boardHeight * 2} cm</span>
                  </div>
                </div>
              )}

              {/* SIGNBOARD ASSEMBLY */}
              <div
                ref={boardRef}
                className={`relative transition-all ${isDragging ? 'cursor-grabbing' : 'cursor-grab'} ${boardShape === 'hexagon' ? 'clip-path-hex' : ''} ${textureObj.class}`}
                style={{
                  width: `${boardWidth}%`,
                  height: `${boardHeight}%`,
                  maxWidth: '720px',
                  maxHeight: '480px',
                  borderRadius: boardShape === 'rounded-rect' ? '28px' : boardShape === 'oval' ? '120px' : boardShape === 'circle' ? '50%' : boardShape === 'hexagon' ? '0' : '0px',
                  borderWidth: `${borderWidth}px`,
                  borderColor: borderColor,
                  // CSS 3D perspectives tilt
                  transform: is3DActive ? `perspective(1200px) rotateX(${isometricTiltX}deg) rotateY(${isometricTiltY}deg)` : 'none',
                  boxShadow: is3DActive 
                    ? `12px 16px 32px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.1)` 
                    : `0 8px 24px rgba(0,0,0,0.85)`,
                  // Base structural material texture CSS styling
                  ...textureObj.style,
                  // Backlit LED Halo glow projected onto the background behind the signboard (if backlit is active)
                  filter: (lightType === 'backlit' && powerOn) 
                    ? `drop-shadow(0 0 ${glowIntensity * 0.4}px ${glowColor}) drop-shadow(0 0 ${glowIntensity * 0.1}px ${glowColor})` 
                    : 'none',
                  zIndex: 3
                }}
              >
                
                {/* SVG Poly Filter Clip Path for hexagon shape */}
                {boardShape === 'hexagon' && (
                  <svg className="absolute w-0 h-0">
                    <defs>
                      <clipPath id="hexagon-clip" clipPathUnits="objectBoundingBox">
                        <polygon points="0.25 0, 0.75 0, 1 0.5, 0.75 1, 0.25 1, 0 0.5" />
                      </clipPath>
                    </defs>
                  </svg>
                )}

                {/* Standoff Chrome Wall Spacers (Visual accessories in corners) */}
                {hasSpacers && (
                  <>
                    <div className="absolute top-4 left-4 w-5 h-5 rounded-full bg-gradient-to-tr from-zinc-600 via-zinc-400 to-zinc-700 border border-zinc-500/50 shadow-md flex items-center justify-center z-10">
                      <div className="w-1.5 h-1.5 rounded-full bg-zinc-900 shadow-inner"></div>
                    </div>
                    <div className="absolute top-4 right-4 w-5 h-5 rounded-full bg-gradient-to-tr from-zinc-600 via-zinc-400 to-zinc-700 border border-zinc-500/50 shadow-md flex items-center justify-center z-10">
                      <div className="w-1.5 h-1.5 rounded-full bg-zinc-900 shadow-inner"></div>
                    </div>
                    <div className="absolute bottom-4 left-4 w-5 h-5 rounded-full bg-gradient-to-tr from-zinc-600 via-zinc-400 to-zinc-700 border border-zinc-500/50 shadow-md flex items-center justify-center z-10">
                      <div className="w-1.5 h-1.5 rounded-full bg-zinc-900 shadow-inner"></div>
                    </div>
                    <div className="absolute bottom-4 right-4 w-5 h-5 rounded-full bg-gradient-to-tr from-zinc-600 via-zinc-400 to-zinc-700 border border-zinc-500/50 shadow-md flex items-center justify-center z-10">
                      <div className="w-1.5 h-1.5 rounded-full bg-zinc-900 shadow-inner"></div>
                    </div>
                  </>
                )}

                {/* Interactive Bounding Overlay guidelines */}
                {showMeasurements && (
                  <div className="absolute inset-0 border border-red-500/10 pointer-events-none flex items-center justify-center">
                    <div className="w-full h-[1px] bg-red-500/10"></div>
                    <div className="h-full w-[1px] bg-red-500/10 absolute"></div>
                  </div>
                )}

                {/* DYNAMIC TEXT LAYERS */}
                {layers.map((layer) => {
                  const isSelected = layer.id === selectedLayerId;
                  const glowColorClass = (pulseActive && powerOn) ? 'neon-pulse-active' : (flickerActive && powerOn) ? 'neon-flicker-active' : '';

                  return (
                    <div
                      key={layer.id}
                      onMouseDown={(e) => handleMouseDown(e, layer.id)}
                      onTouchStart={(e) => handleTouchStart(e, layer.id)}
                      className={`absolute select-none px-4 py-2 transition-transform duration-75 ${isSelected ? 'border border-red-500/50 rounded-lg bg-red-500/5' : 'hover:border hover:border-zinc-700/40 rounded-lg'} ${glowColorClass}`}
                      style={{
                        ...getLayerStyle(layer),
                        '--glow-color': lightType === 'neon' ? layer.color : glowColor,
                        userSelect: 'none'
                      }}
                    >
                      {/* Active Selector boundary anchors */}
                      {isSelected && (
                        <>
                          <div className="absolute -top-1 -left-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white" />
                          <div className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white" />
                          <div className="absolute -bottom-1 -left-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white" />
                          <div className="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white" />
                          {/* Position overlay coordinates badge */}
                          <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-zinc-900 border border-zinc-700 px-1.5 py-0.5 rounded text-[8px] text-zinc-300 font-mono whitespace-nowrap opacity-85">
                            X: {layer.x}% Y: {layer.y}%
                          </div>
                        </>
                      )}
                      
                      {/* Realistic marquee tiny bulb markers (for frontlit marquee appearance) */}
                      {lightType === 'frontlit' && powerOn && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                          <span className="w-1.5 h-1.5 rounded-full bg-white shadow-lg animate-ping"></span>
                        </div>
                      )}

                      {/* Actual Rendered Text Content */}
                      {layer.text}
                    </div>
                  );
                })}
              </div>

            </div>

            {/* QUICK CONTROL BAR BELOW CANVAS */}
            <div className="bg-zinc-950/90 border-t border-zinc-900 p-4 px-6 flex flex-col sm:flex-row items-center justify-between space-y-4 sm:space-y-0 z-10 backdrop-blur-sm">
              <div className="flex flex-col">
                <span className="text-xs text-zinc-500">Signboard Configuration Summary</span>
                <span className="text-sm font-semibold text-zinc-300">
                  {boardWidth * 2} x {boardHeight * 2} cm &bull; {SHAPES.find(s => s.id === boardShape)?.name} &bull; {TEXTURES.find(t => t.id === boardTexture)?.name}
                </span>
              </div>

              {/* Estimate Cost and Order Actions */}
              <div className="flex items-center space-x-4">
                <div className="text-right">
                  <span className="text-xs text-zinc-500 block">Estimated Cost</span>
                  <span className="text-lg font-bold text-red-500 font-mono">${calculatedPricing.total} USD</span>
                </div>
                <button
                  onClick={() => setIsQuoteModalOpen(true)}
                  className="bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-5 rounded-xl text-xs shadow-lg shadow-red-600/20 transition-all flex items-center space-x-1.5"
                >
                  <span>Build Sign</span>
                  <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

          </div>

          {/* DYNAMIC MODAL FOR CUSTOM ESTIMATE/FABRICATION REQUEST */}
          {isQuoteModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl transition-all scale-100">
                <div className="p-6 border-b border-zinc-800 flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="sparkles" className="text-red-500 w-5 h-5"></i>
                    <h2 className="text-lg font-bold text-zinc-100">Custom Signboard Order Details</h2>
                  </div>
                  <button
                    onClick={() => setIsQuoteModalOpen(false)}
                    className="p-1.5 rounded-lg bg-black text-zinc-400 hover:text-zinc-100 transition-all"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
                  {/* Visual snapshot breakdown */}
                  <div className="bg-black p-4 rounded-2xl border border-zinc-850 space-y-3">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400">Signage Spec Sheet</h4>
                    
                    <div className="grid grid-cols-2 gap-4 text-xs">
                      <div>
                        <span className="text-zinc-500 block">Plate Shape / Backing</span>
                        <span className="text-zinc-200 font-semibold">{SHAPES.find(s => s.id === boardShape)?.name}</span>
                      </div>
                      <div>
                        <span className="text-zinc-500 block">Plate Material Finish</span>
                        <span className="text-zinc-200 font-semibold">{TEXTURES.find(t => t.id === boardTexture)?.name}</span>
                      </div>
                      <div>
                        <span className="text-zinc-500 block">Total Layout Dimensions</span>
                        <span className="text-zinc-200 font-semibold">{boardWidth * 2} x {boardHeight * 2} cm</span>
                      </div>
                      <div>
                        <span className="text-zinc-500 block">Light Source Engine</span>
                        <span className="text-zinc-200 font-semibold uppercase">{lightType} ({pulseActive ? 'Pulse' : 'Static'})</span>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-zinc-900">
                      <span className="text-zinc-500 text-xs block mb-1">Text Custom Layers</span>
                      <div className="space-y-1">
                        {layers.map((l, idx) => (
                          <div key={l.id} className="flex justify-between text-xs font-mono text-zinc-300">
                            <span>Layer {idx+1}: "{l.text}"</span>
                            <span>{l.fontSize}px ({l.fontFamily})</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Pricing summary */}
                  <div className="space-y-3">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400">Pricing Breakdown</h4>
                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between text-zinc-400">
                        <span>Physical custom backing plate</span>
                        <span className="text-zinc-200 font-mono">${calculatedPricing.backing}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>CNC custom lettering & framework</span>
                        <span className="text-zinc-200 font-mono">${calculatedPricing.structural}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>Custom bent gas tubes / LED module channels</span>
                        <span className="text-zinc-200 font-mono">${calculatedPricing.tubes}</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>Hardware anchors & power converter kit</span>
                        <span className="text-zinc-200 font-mono">${calculatedPricing.hardware}</span>
                      </div>
                      <div className="border-t border-zinc-800 pt-3 flex justify-between text-base font-bold text-zinc-100">
                        <span>Estimated Quote Total</span>
                        <span className="text-red-500 font-mono text-lg">${calculatedPricing.total} USD</span>
                      </div>
                    </div>
                  </div>

                  {/* Form fields */}
                  <div className="space-y-3 pt-3 border-t border-zinc-800">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400">Contact & Shipping Info</h4>
                    <div className="grid grid-cols-2 gap-3">
                      <input
                        type="text"
                        placeholder="Your Name"
                        className="bg-black border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-red-500"
                      />
                      <input
                        type="email"
                        placeholder="Email Address"
                        className="bg-black border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-red-500"
                      />
                    </div>
                    <textarea
                      placeholder="Special installation notes or instructions..."
                      rows="2"
                      className="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-red-500"
                    />
                  </div>
                </div>

                <div className="p-6 bg-black border-t border-zinc-850 flex space-x-3">
                  <button
                    onClick={() => setIsQuoteModalOpen(false)}
                    className="flex-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-300 font-semibold py-2.5 rounded-xl text-xs transition-all"
                  >
                    Back to Canvas
                  </button>
                  <button
                    onClick={() => {
                      alert('Thank you! Your custom signboard specifications have been submitted successfully. Our designers will send a final structural proof within 24 hours.');
                      setIsQuoteModalOpen(false);
                    }}
                    className="flex-1 bg-gradient-to-r from-red-600 to-red-700 hover:opacity-90 text-white font-semibold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-red-600/10"
                  >
                    Submit Specification Details
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>

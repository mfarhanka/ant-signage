<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Signage Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside id="toolbar" class="toolbar toolbar-left is-expanded" aria-label="Design toolbar">
      <button id="toolbarToggle" class="toolbar-handle" type="button" aria-expanded="true" aria-controls="toolbarContent">
        <span class="toolbar-handle-title">Design tools</span>
        <span id="toolbarToggleIcon" class="toolbar-handle-icon">Collapse</span>
      </button>

      <section id="toolbarContent" class="toolbar-content">
        <div class="panel-copy">
          <p class="eyebrow">Live Signage Designer</p>
          <h1>Build a display with editable text, light, texture, and color.</h1>
          <p class="intro">Use the docked toolbar on either side, expand it when you need controls, and keep the stage visible while you design.</p>
        </div>

        <div class="control-group compact-grid">
          <div class="control-row">
            <label for="toolbarSide">Toolbar side</label>
            <select id="toolbarSide" name="toolbarSide">
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <div class="control-row">
            <label for="textInput">Text content</label>
            <input id="textInput" name="textInput" type="text" maxlength="48" placeholder="Enter signage text">
          </div>
          <div class="button-row">
            <button id="addTextButton" type="button">Add text</button>
            <button id="updateTextButton" type="button" class="secondary">Update selected</button>
          </div>
          <div class="control-row">
            <label for="fontSize">Font size</label>
            <input id="fontSize" name="fontSize" type="range" min="32" max="144" value="84">
          </div>
        </div>

        <div class="control-group split-grid">
          <div class="control-row">
            <label for="textColor">Text color</label>
            <input id="textColor" name="textColor" type="color" value="#f2f2f2">
          </div>
          <div class="control-row">
            <label for="glowColor">Glow color</label>
            <input id="glowColor" name="glowColor" type="color" value="#b31217">
          </div>
          <div class="control-row">
            <label for="bgColor">Background color</label>
            <input id="bgColor" name="bgColor" type="color" value="#121212">
          </div>
          <div class="control-row">
            <label for="lightingColor">Lighting color</label>
            <input id="lightingColor" name="lightingColor" type="color" value="#6e6e73">
          </div>
        </div>

        <div class="control-group split-grid">
          <div class="control-row">
            <label for="textureSelect">Background texture</label>
            <select id="textureSelect" name="textureSelect">
              <option value="grid">Neon grid</option>
              <option value="brushed">Brushed metal</option>
              <option value="grain">Paper grain</option>
              <option value="velvet">Velvet haze</option>
            </select>
          </div>
          <div class="control-row">
            <label for="lightPreset">Lighting type</label>
            <select id="lightPreset" name="lightPreset">
              <option value="halo">Halo wash</option>
              <option value="spotlight">Spotlight</option>
              <option value="neon">Neon edge</option>
              <option value="sunset">Sunset bloom</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <div class="control-row">
            <label for="lightingIntensity">Lighting intensity</label>
            <input id="lightingIntensity" name="lightingIntensity" type="range" min="20" max="120" value="62">
          </div>
          <div class="control-row">
            <label for="glowStrength">Glow strength</label>
            <input id="glowStrength" name="glowStrength" type="range" min="10" max="120" value="52">
          </div>
        </div>

        <div class="control-group">
          <div class="list-header">
            <span>Text layers</span>
            <button id="removeTextButton" type="button" class="secondary danger">Remove selected</button>
          </div>
          <ul id="layerList" class="layer-list" aria-label="Text layers"></ul>
        </div>
      </section>
    </aside>

    <section class="preview-shell">
      <div class="stage-meta">
        <div>
          <p class="eyebrow">Preview</p>
          <h2>Live canvas</h2>
        </div>
        <p id="stageSummary" class="summary">1 layer · neon grid · halo wash</p>
      </div>

      <div id="signStage" class="sign-stage texture-grid light-halo">
        <div class="stage-frame"></div>
        <div class="light-pass light-pass-a"></div>
        <div class="light-pass light-pass-b"></div>
        <div id="signTextStack" class="sign-text-stack" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <template id="layerItemTemplate">
    <li class="layer-item">
      <button type="button" class="layer-chip"></button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
